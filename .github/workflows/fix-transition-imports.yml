name: Fix transition imports
on:
  push:
    branches:
      - codex/create-personal-anilist-android-client
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/create-personal-anilist-android-client
          fetch-depth: 0
      - name: Remove invalid top-level transition imports
        run: |
          sed -i '/import androidx.compose.animation.slideIntoContainer/d' app/src/main/java/app/hikari/MainActivity.kt
          sed -i '/import androidx.compose.animation.slideOutOfContainer/d' app/src/main/java/app/hikari/MainActivity.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-transition-imports.yml
          git add app/src/main/java/app/hikari/MainActivity.kt .github/workflows/fix-transition-imports.yml
          git commit -m 'Fix Navigation transition imports'
          git push origin codex/create-personal-anilist-android-client
