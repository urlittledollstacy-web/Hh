name: Android Build - final navigation verification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/create-personal-anilist-android-client

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/create-personal-anilist-android-client
          fetch-depth: 0

      # ONE-TIME FIX: move predictive-back transition handling into Navigation Compose 2.10,
      # explicitly opt into system predictive back, then remove this mutation block from the
      # workflow before committing the source changes. The current run continues with the fixed tree.
      - name: Apply predictive back fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          branch = "codex/create-personal-anilist-android-client"

          versions = Path("gradle/libs.versions.toml")
          text = versions.read_text()
          text = text.replace('navigation = "2.9.8"', 'navigation = "2.10.0"')
          versions.write_text(text)

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android:enableOnBackInvokedCallback="true"' not in text:
              text = text.replace(
                  'android:allowBackup="false"',
                  'android:allowBackup="false"\n        android:enableOnBackInvokedCallback="true"',
                  1,
              )
          manifest.write_text(text)

          main = Path("app/src/main/java/app/hikari/MainActivity.kt")
          text = main.read_text()
          if 'predictivePopEnterTransition' not in text:
              text = text.replace(
                  'import androidx.activity.ComponentActivity\n',
                  'import androidx.activity.BackEventCompat\nimport androidx.activity.ComponentActivity\n',
                  1,
              )
              text = text.replace(
                  'import androidx.navigation.NavType\n',
                  'import androidx.compose.animation.AnimatedContentTransitionScope.SlideDirection\n'
                  'import androidx.compose.animation.core.tween\n'
                  'import androidx.compose.animation.slideIntoContainer\n'
                  'import androidx.compose.animation.slideOutOfContainer\n'
                  'import androidx.navigation.NavType\n',
                  1,
              )
              old = '''                NavHost(
                    navController = navController,
                    startDestination = "shell",
                    modifier = Modifier.fillMaxSize(),
                ) {'''
              new = '''                NavHost(
                    navController = navController,
                    startDestination = "shell",
                    modifier = Modifier.fillMaxSize(),
                    enterTransition = { slideIntoContainer(SlideDirection.Left, tween(300)) },
                    exitTransition = { slideOutOfContainer(SlideDirection.Left, tween(300)) },
                    popEnterTransition = { slideIntoContainer(SlideDirection.Right, tween(300)) },
                    popExitTransition = { slideOutOfContainer(SlideDirection.Right, tween(300)) },
                    predictivePopEnterTransition = { swipeEdge ->
                        if (swipeEdge == BackEventCompat.EDGE_RIGHT) {
                            slideIntoContainer(SlideDirection.Left, tween(300))
                        } else {
                            slideIntoContainer(SlideDirection.Right, tween(300))
                        }
                    },
                    predictivePopExitTransition = { swipeEdge ->
                        if (swipeEdge == BackEventCompat.EDGE_RIGHT) {
                            slideOutOfContainer(SlideDirection.Left, tween(300))
                        } else {
                            slideOutOfContainer(SlideDirection.Right, tween(300))
                        }
                    },
                ) {'''
              if old not in text:
                  raise SystemExit("NavHost insertion point not found")
              text = text.replace(old, new, 1)
          main.write_text(text)

          workflow = Path(".github/workflows/android-build.yml")
          workflow_text = workflow.read_text()
          start = workflow_text.index('      # ONE-TIME FIX:')
          end = workflow_text.index('      - name: Set up JDK 17', start)
          workflow_text = workflow_text[:start] + workflow_text[end:]
          workflow_text = workflow_text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          workflow.write_text(workflow_text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml app/src/main/AndroidManifest.xml app/src/main/java/app/hikari/MainActivity.kt .github/workflows/android-build.yml
          git commit -m "Enable predictive back navigation"
          git push origin "HEAD:${branch}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Gradle
        run: |
          set -euo pipefail
          rm -rf /tmp/gradle /tmp/gradle.zip
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.14.4-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Prepare Android build environment
        run: |
          sed -i "s|^org.gradle.java.home=.*$|org.gradle.java.home=$JAVA_HOME|" gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          grep '^org.gradle.java.home=' gradle.properties
          grep '^sdk.dir=' local.properties

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          ls -la
          ls -la app

      - name: Build debug APK
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --info -PANILIST_CLIENT_ID="$ANILIST_CLIENT_ID" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-compiler-log
          path: build.log
          if-no-files-found: warn
