name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/create-personal-anilist-android-client

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/create-personal-anilist-android-client
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Gradle
        run: |
          set -euo pipefail
          rm -rf /tmp/gradle /tmp/gradle.zip
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.14.4-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Prepare Android build environment
        run: |
          sed -i "s|^org.gradle.java.home=.*$|org.gradle.java.home=$JAVA_HOME|" gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          grep '^org.gradle.java.home=' gradle.properties
          grep '^sdk.dir=' local.properties

      - name: Apply navigation fix
        if: hashFiles('.github/apply-navigation-fix-v3.py') != ''
        run: |
          set +e
          python3 .github/apply-navigation-fix-v3.py > /tmp/navigation-patch.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cp /tmp/navigation-patch.log .github/patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/patch-error.txt
            git commit -m 'Record navigation patch error'
            git push origin codex/create-personal-anilist-android-client
            exit "$status"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/apply-navigation-fix.py .github/apply-navigation-fix-v2.py .github/apply-navigation-fix-v3.py .github/patch-debug-v4.py .github/patch-debug.txt
          rm .github/workflows/apply-navigation-fix.yml
          git add app/src/main/java/app/hikari/MainActivity.kt app/src/main/java/app/hikari/media/MediaDetailsScreen.kt .github/apply-navigation-fix.py .github/apply-navigation-fix-v2.py .github/apply-navigation-fix-v3.py .github/patch-debug-v4.py .github/patch-debug.txt .github/workflows/apply-navigation-fix.yml
          git commit -m 'Fix navigation stack and predictive back'
          git push origin codex/create-personal-anilist-android-client

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          ls -la
          ls -la app

      - name: Build debug APK
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace --info -PANILIST_CLIENT_ID="$ANILIST_CLIENT_ID"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
