name: Fix airing query

on:
  push:
    branches:
      - codex/create-personal-anilist-android-client

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AniList airing sort
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("app/src/main/java/app/hikari/data/remote/AniListGraphQlService.kt"),
              Path("app/src/main/java/app/hikari/data/remote/AniListCalendarService.kt"),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace("airingSchedules(airingAt_greater:\\$now,sort:TIME_ASC)", "airingSchedules(notYetAired:true,airingAt_greater:\\$now,sort:TIME)")
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/hikari/data/remote/AniListGraphQlService.kt app/src/main/java/app/hikari/data/remote/AniListCalendarService.kt
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix AniList airing schedule sort"
          git push
          rm -f .github/workflows/fix-airing-query.yml
          git add .github/workflows/fix-airing-query.yml
          git commit -m "Remove temporary airing query fixer"
          git push
