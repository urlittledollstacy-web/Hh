name: Fix calendar airing sort

on:
  push:
    branches:
      - codex/create-personal-anilist-android-client

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace invalid airing sort enum
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/app/hikari/data/remote/AniListCalendarService.kt")
          text = path.read_text().replace("sort:TIME_ASC", "sort:TIME")
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/hikari/data/remote/AniListCalendarService.kt
          git commit -m "Fix calendar airing sort enum"
          git push
          rm -f .github/workflows/fix-calendar-airing-sort.yml
          git add .github/workflows/fix-calendar-airing-sort.yml
          git commit -m "Remove temporary calendar airing fixer"
          git push
