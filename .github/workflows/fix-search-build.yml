name: Fix search build

on:
  push:
    branches:
      - codex/create-personal-anilist-android-client

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/create-personal-anilist-android-client
          fetch-depth: 1
      - name: Apply Home recommendations
        run: python3 .github/apply_home_recommendations.py
